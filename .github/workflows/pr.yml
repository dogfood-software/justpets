# .github/workflows/pr-title.yml
name: 🌿 PR

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    name: 🏷️ Title
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6

      - name: 🔨 Install root dependencies
        run: pnpm install --filter justpets --frozen-lockfile

      - name: ✅ Lint PR title
        run: echo "${{ github.event.pull_request.title }}" | pnpx commitlint
